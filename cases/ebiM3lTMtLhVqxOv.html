  <script>window.__PAYLOAD__ = {"c":"口腔种植科  高阳治疗组","p":"严定良","d":"2026-08-09","g":[{"t":"用药指导","i":["止痛药：双氯芬酸钠缓释胶囊。视情况自行服用，每次1粒，每日不超过2粒。","消炎药：阿莫西林克拉维酸钾片。严格遵医嘱服用，共服用4天。","消炎药：奥硝唑胶囊。严格遵医嘱服用，共服用4天。","消肿药：地塞米松片。严格遵医嘱服用，每日三次，每次1粒，共服用四天。","漱口水：每顿饭后含一口在嘴巴里（约一瓶盖的量），1分钟后漱口吐掉。"]},{"t":"术后不适","i":["疼痛：一般术后两天疼痛较明显，之后逐渐缓解。期间可视情况服用止痛药。","出血：术后一天内唾液中带有少量血丝是正常现象，尽量避免用力漱口、吮吸。如果渗血或出血的情况超过2天，请及时复诊。","肿胀：通常术后2-3日达到肿胀高峰，之后逐渐消减，1周左右完全消肿。口服消肿药+术后24小时内间断冰敷有助于缓解肿胀。"]},{"t":"生活指导","i":["刷牙：手术当天不刷牙，第二天可以正常刷其他牙齿。针对术区，可以使用小头软毛牙刷或棉签轻轻清洁，避免食物残渣或软垢堆积。请勿完全不刷牙或暴力清洁！","饮食：清淡饮食。避免进食过烫、辛辣、坚硬的食物！避免用术区咀嚼食物！","运动：手术通常不会影响您的正常生活，但需避免过度疲劳、频繁说话、剧烈运动。禁止频繁按压术区。","术后禁止抽烟饮酒：抽烟、喝酒会影响创口愈合，尼古丁会影响种植体骨结合！术后两周禁止抽烟，牙龈完全愈合前禁止饮酒。"]},{"t":"特殊观察","i":["术后不适通常会逐渐减轻，但是如果出现以下情况请及时联系复诊：术区出血超过2天、消肿后出现再次肿胀、疼痛加重、术区发热、不适感持续未缓解、牙龈红肿、或其他异常情况。","术后1-2天内偶有骨粉颗粒脱落为正常现象，不必担心。如果创口裂开、缝线脱落请及时联系复诊。"]}],"f":["4个月后09:00，拆线。"],"dr":"高阳医生","ft":"联系电话：种植科一诊室 028-85503579"};</script>
