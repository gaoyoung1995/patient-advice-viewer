  <script>window.__PAYLOAD__ = {"c":"口腔种植科  高阳治疗组","p":"何云见","d":"2026-08-09","g":[{"t":"种植牙清洁","i":["保持干净的口腔卫生对天然牙和种植牙的长期健康都至关重要！","刷  牙：每天至少早、晚各1次刷牙。需要强调的是，刷牙的重点在于“面面俱到”，并非刷够3分钟就肯定干净！因此刷牙时需注意将牙刷伸到牙齿的每个面进行清洁，易被忽视的地方包括：牙齿与牙龈交界处，牙齿的舌面、位置靠里的后牙，","牙缝清洁：建议将牙缝清洁纳入常规的口腔清洁习惯，作为刷牙后的补充，可以获得更好的牙齿清洁效果。 常见的清洁工具包括：牙线、 间隙刷、冲牙器，选择一种适合自己、用着顺手的即可。对于不知道使用什么工具的患者，通常建议先尝试使用牙线。牙线具有便携、便宜、适用人群广泛的优点，使用时应采用“拉锯子”的方式将牙线轻柔放入牙缝，再贴合两侧牙面刮出软垢/食物残渣。间隙刷通常适用于牙缝较大的患者。冲牙器又称“水牙线”，使用时需注意水流的方向应穿过牙缝，避免直接对着牙龈。","洁  牙：根据自己口腔卫生维护的效果，建议半年至一年洁牙一次。洁牙时请告知医生哪些是种植牙，种植牙周需要用专用的特殊洁牙工作头清洁。"]},{"t":"使用习惯","i":["适宜的咬合力同样是天然牙健康和种植牙长期生存的关键。","戴牙后24小时之内暂不要用种植牙咀嚼，特别是粘性食物。待粘接剂充分固化24小时后即可正常使用。","在日常使用中，种植牙可以帮助您正常进食（饭、菜、肉）。但不能使用种植牙咀嚼硬物，如坚果、胡豆、脆骨、甘蔗、蟹壳、碎骨等。对于前牙种植患者，勿用种植牙大力啃苹果等较为坚固的食物，可能会导致前牙受侧向力较重，提高脱粘接风险。严禁用种植牙开啤酒瓶盖！"]},{"t":"可能的不适","i":["食物嵌塞：食物嵌塞是种植牙戴入后最常出现的一类问题，在天然牙列里面随着牙齿的磨耗也多有发生。食物嵌塞主要是由于牙缝下的“牙龈尖尖”（学名：龈乳头）退缩。即使种植牙戴入后，已退缩的“牙龈尖尖”也无法完全恢复，就形成了我们常说的“黑三角”。这是目前种植修复后无法避免的问题，医生通常会通过调整牙冠的形态来尽量减小黑三角。如出现食物嵌塞，请使用牙线等工具进行清洁。","崩瓷：目前绝大部分种植牙冠为全瓷冠，主要成分是氧化锆，强度较高，通常较少出现崩瓷。如有出现，请及时联系进行复诊检查。","松动：种植牙松动的原因非常多，针对不同原因的处理方式也完全不同。因此，如有出现，请勿再用种植牙进行咀嚼，并尽快联系医生进行复诊检查。","咬合偏高：通常出现在戴牙后不久。戴牙时的咬合位置与日常使用不完全一致，就可能出现回家后又觉得咬合过高。需复诊重新检查咬合，切勿将就使用！","牙龈出血、肿痛、不适：种植体与天然牙相仿，其周围也可能出现炎症，称为“种植体周炎”。如有出现，请加强口腔卫生清洁并预约复诊检查。"]},{"t":"定期复诊","i":["种植牙戴牙后即使没有不适，也建议定期复诊。复诊主要检查咬合、卫生情况、牙槽骨的变化。建议的复诊时间为：戴牙后三个月，再过六个月，之后每隔一年一次。可拨打科室电话028-8550 3579进行预约。"]}],"f":[],"dr":"高阳医生","ft":"联系电话：种植科一诊室 028-85503579"};</script>
